<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexora showreel</title>
<!--
  Nexora 20-second promo, cut on bar lines of a 120 BPM score (bars start at 0.5 s and every 2 s after).
  render(t) sets the whole frame for second t, so render.js can step through it with sub-frames for
  motion blur. Open showreel.html?t=12.3 to look at one moment.
-->
<style>
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:100 900;font-display:block;src:url(cache/fonts/InterTight-700-normal.woff2) format('woff2');}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:block;src:url(cache/fonts/InstrumentSerif-400-italic.woff2) format('woff2');}
:root{--a:#ff2d55;--b:#a855f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
body{color:#fff;font:600 40px/1.1 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:-.015em}
.grad{background:linear-gradient(95deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em 0 .02em}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.layer{position:absolute;inset:0}
#spot{background:radial-gradient(70% 46% at 50% 44%,#202026 0%,#0d0d10 55%,#050506 100%)}
#tint{background:radial-gradient(40% 26% at 50% 62%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%)}

/* headlines */
.head{position:absolute;left:0;right:0;text-align:center}
.hl{overflow:hidden;padding:0 0 .14em;line-height:1}
.hl > span{display:inline-block;font-size:108px;font-weight:650;letter-spacing:-.048em;line-height:1}
.hl em{font-size:1.12em}
.sub{position:absolute;left:0;right:0;text-align:center;font-size:40px;font-weight:500;letter-spacing:-.01em;color:#9b9ba3}

/* S1 shelves */
#shelves{position:absolute;inset:0;transform-origin:50% 50%}
.row{position:absolute;left:0;display:flex;gap:30px;will-change:transform}
.row img{width:300px;height:450px;border-radius:18px;object-fit:cover;flex:none}
#shelfShade{background:radial-gradient(70% 20% at 50% 50%,rgba(0,0,0,.9),rgba(0,0,0,.45) 100%),linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 82%,#000 100%)}

/* phone */
#pwrap{position:absolute;left:0;top:0;width:556px;height:1162px;perspective:2600px;transform-origin:50% 50%}
#phone3d{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%}
.frame{position:absolute;inset:0;border-radius:80px;padding:12px;background:linear-gradient(135deg,#e3e3e8 0%,#77777e 9%,#2e2e33 24%,#18181b 60%,#55555b 88%,#d0d0d6 100%);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 90px 120px -40px rgba(0,0,0,.95)}
.frame::before{content:"";position:absolute;inset:2px;border-radius:78px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none}
.btn{position:absolute;width:6px;border-radius:3px;background:linear-gradient(90deg,#5a5a60,#c9c9cf)}
.bezel{position:relative;width:100%;height:100%;border-radius:68px;padding:6px;background:#020203}
#glass{position:relative;width:520px;height:1126px;border-radius:62px;overflow:hidden;background:#000}
.scr{position:absolute;inset:0;overflow:hidden}
.scr > img{position:absolute;left:0;top:0;width:520px}
.full{height:1126px;object-fit:cover;object-position:top}
#island{position:absolute;left:50%;top:20px;width:126px;height:36px;margin-left:-63px;border-radius:20px;background:#000;z-index:5}
#glare{position:absolute;inset:0;border-radius:62px;z-index:6;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 44%,rgba(255,255,255,0) 58%);background-size:260% 100%}
#tap{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);opacity:0;z-index:7}
#shadow{position:absolute;width:640px;height:80px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.85),transparent);filter:blur(10px)}

/* depth of field: blur what's behind, except a sharp band */
.dof{position:absolute;inset:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:none}

/* S3 brand */
#s3 .logo{position:absolute;left:390px;top:640px;width:300px;height:300px}
#wm{position:absolute;left:0;right:0;top:1010px;text-align:center;font-weight:700;font-size:96px;letter-spacing:.2em;padding-left:.2em;white-space:nowrap}
#wm span{background:linear-gradient(90deg,#ff2d55,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
#tag{position:absolute;left:0;right:0;top:1150px;text-align:center;font-size:32px;font-weight:500;letter-spacing:.42em;padding-left:.42em;color:#8e8e96;text-transform:uppercase}
#glow{position:absolute;left:540px;top:790px;width:1100px;height:1100px;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,45,85,.16),rgba(168,85,247,.07) 50%,transparent)}

/* S7 macro profile */
#macro{position:absolute;inset:0;perspective:2000px}
#macroIn{position:absolute;left:-610px;top:263px;width:2300px;transform-origin:1150px 787px}
#macroIn img{position:absolute;left:0;top:0;width:2300px}
#dots{position:absolute;left:0;right:0;top:1700px;display:flex;justify-content:center;gap:34px}
#dots i{width:58px;height:58px;border-radius:50%}

/* S8 words */
.word{position:absolute;left:0;right:0;top:860px;text-align:center;overflow:hidden;padding-bottom:.14em;white-space:nowrap}
.word.small > span{font-size:150px}
.word > span{display:inline-block;font-size:190px;font-weight:650;letter-spacing:-.055em;line-height:1}
.word em{font-size:1.1em}

/* S9 end */
#s9 .logo{position:absolute;left:470px;top:250px;width:140px;height:140px}
#cta{position:absolute;left:50%;top:700px;display:flex;align-items:center;gap:20px;height:112px;padding:0 54px;border-radius:999px;background:#fff;color:#000;font-size:42px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;translate:-50% 0}
#cta svg{width:40px;height:40px}
#meta{position:absolute;left:0;right:0;top:862px;text-align:center;font-size:32px;font-weight:500;color:#85858d}

#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.07;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 62% at 50% 50%,transparent 60%,rgba(0,0,0,.45))}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="spot"></div>
  <div class="layer" id="tint"></div>

  <!-- S1: the whole library -->
  <div class="layer" id="s1">
    <div id="shelves"></div>
    <div class="dof" id="dof1"></div>
    <div class="layer" id="shelfShade"></div>
    <div class="head" id="h1" style="top:830px"><div class="hl"><span>The whole</span></div><div class="hl"><span><em class="grad">library.</em></span></div></div>
  </div>

  <!-- S3: brand -->
  <div class="layer" id="s3">
    <div id="glow"></div>
    <svg class="logo" id="logo3" viewBox="0 0 100 100"></svg>
    <div id="wm">NEX<span>ORA</span></div>
    <div id="tag">Movies · Series · Anime</div>
  </div>

  <!-- S7: macro on the profile -->
  <div class="layer" id="s7">
    <div id="macro"><div id="macroIn">
      <img src="shots/profile_rose.jpg"><img src="shots/profile_violet.jpg"><img src="shots/profile_ocean.jpg"><img src="shots/profile_emerald.jpg"><img src="shots/profile_gold.jpg">
    </div></div>
    <div class="layer" style="background:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 70%,#000 96%)"></div>
    <div class="dof" id="dof7"></div>
    <div id="dots"></div>
  </div>

  <!-- the phone, shared by S2, S4, S5, S6 and S9 -->
  <div id="shadow"></div>
  <div id="pwrap">
    <div id="phone3d">
      <div class="frame">
        <i class="btn" style="left:-4px;top:250px;height:60px"></i><i class="btn" style="left:-4px;top:340px;height:110px"></i><i class="btn" style="left:-4px;top:470px;height:110px"></i><i class="btn" style="right:-4px;top:360px;height:170px"></i>
        <div class="bezel"><div id="glass">
          <div class="scr" id="scrHome"><img id="homeTall" src="shots/home_tall.jpg"><img id="topbar" src="shots/topbar.png"><img src="shots/tabbar.png" style="top:1046.5px"></div>
          <div class="scr" id="scrHome2"><img class="full" src="shots/home.jpg"></div>
          <div class="scr" id="scrMovies"><img class="full" src="shots/movies.jpg"></div>
          <div class="scr" id="scrSeries"><img class="full" src="shots/series.jpg"></div>
          <div class="scr" id="scrAnime"><img class="full" src="shots/anime.jpg"></div>
          <div class="scr" id="scrNew"><img class="full" src="shots/new.jpg"></div>
          <div class="scr" id="scrTitle"><img class="full" src="shots/title.jpg"></div>
          <div class="scr" id="scrTitleA"><img class="full" src="shots/title_anime.jpg"></div>
          <div class="scr" id="scrVideo" style="background:#000"><img id="vid" src="shots/player_video.jpg" style="width:1126px;height:634px;left:-303px;top:246px;transform:rotate(90deg)"></div>
          <div id="island"></div>
          <div id="tap"></div>
          <div id="glare"></div>
        </div></div>
      </div>
    </div>
  </div>
  <div class="dof" id="dofP"></div>

  <!-- phone-scene type sits above the depth of field -->
  <div class="head" id="h2" style="top:210px"><div class="hl"><span>In <em class="grad">Hindi,</em> first.</span></div></div>
  <div class="sub" id="sub2" style="top:370px">Or English. Or the original.</div>
  <div class="head" id="h4" style="top:150px"><div class="hl"><span>Opens on what's</span></div><div class="hl"><span><em class="grad">worth</em> watching.</span></div></div>
  <div id="h5"></div>
  <div class="head" id="h6" style="top:150px"><div class="hl"><span>One tap, and</span></div><div class="hl"><span>it <em class="grad">plays.</em></span></div></div>
  <div class="sub" id="sub6" style="top:1370px">Up to 1080p</div>
  <div class="head" id="h7" style="top:170px"><div class="hl"><span>Make it <em class="grad">yours.</em></span></div></div>

  <!-- S8: words -->
  <div class="layer" id="s8"></div>

  <!-- S9: end -->
  <div class="layer" id="s9">
    <svg class="logo" id="logo9" viewBox="0 0 100 100"></svg>
    <div class="head" id="h9" style="top:440px"><div class="hl"><span>Tonight's <em class="grad">sorted.</em></span></div></div>
    <div id="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 20h14"/></svg>Download for Android</div>
    <div id="meta">Free &nbsp;·&nbsp; No sign-up &nbsp;·&nbsp; Android 7.0+</div>
  </div>

  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>

<script src="cache/posters.js"></script>
<script>
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 5),                      // quint out: the house curve for entrances
  expo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOut: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  smooth: x => x * x * (3 - 2 * x),
  in: x => x * x * x,
};
function keys(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
    const [t0, v0] = k[i - 1], [t1, v1, e] = k[i];
    return lerp(v0, v1, E[e || 'inOut']((t - t0) / (t1 - t0)));
  }
  return k[k.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = id => document.getElementById(id);
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const within = (t, a, b) => t >= a && t < b;

// ---------- scene clock (bar lines) ----------
const S = { lib: [0, 2.5], hindi: [2.5, 4.5], brand: [4.5, 6.5], feed: [6.5, 8.5], tabs: [8.5, 10.5], play: [10.5, 12.5], yours: [12.5, 14.5], words: [14.5, 16.5], end: [16.5, 20] };

// ---------- colour ----------
const ACCENTS = [['#ff2d55', '#a855f7'], ['#a06bff', '#5b7cff'], ['#2fa8ff', '#22d3c5'], ['#2bd17e', '#14b8a6'], ['#f5b83d', '#f0803c']];
const SWITCH = [[12.75, 1], [13.25, 2], [13.75, 3], [14.25, 4], [14.5, 0]];
const accentIndex = t => { let i = 0; for (const [s, k] of SWITCH) if (t >= s) i = k; return i; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function accentAt(t) {
  let from = 0, to = 0, at = -1;
  for (const [s, k] of SWITCH) if (t >= s) { from = to; to = k; at = s; }
  const x = at < 0 ? 1 : E.out(P(t, at, at + .18));
  return [0, 1].map(j => { const a = hex(ACCENTS[from][j]), b = hex(ACCENTS[to][j]); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], x))).join(',')})`; });
}

// ---------- logo ----------
function logoSVG(svg, id) {
  svg.innerHTML = `<defs>
    <linearGradient id="${id}L" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#d81b4f"/></linearGradient>
    <linearGradient id="${id}D" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset=".55" stop-color="#d9389a"/><stop offset="1" stop-color="#9b4cf0"/></linearGradient>
    <linearGradient id="${id}R" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b06bff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <clipPath id="${id}cL"><rect x="0" y="84" width="100" height="0"/></clipPath>
    <clipPath id="${id}cD"><rect x="0" y="16" width="100" height="0"/></clipPath>
    <clipPath id="${id}cR"><rect x="0" y="84" width="100" height="0"/></clipPath></defs>
  <g clip-path="url(#${id}cL)"><polygon points="24,16 40,16 40,84 24,84" fill="url(#${id}L)"/></g>
  <g clip-path="url(#${id}cR)"><polygon points="60,16 76,16 76,84 60,84" fill="url(#${id}R)"/></g>
  <g clip-path="url(#${id}cD)"><polygon points="24,16 40,16 76,84 60,84" fill="url(#${id}D)"/><polygon points="24,16 40,16 44,23.5 28,23.5" fill="rgba(0,0,0,.2)"/><polygon points="56,76.5 72,76.5 76,84 60,84" fill="rgba(0,0,0,.2)"/></g>`;
  const r = k => svg.querySelector(`#${id}${k} rect`);
  return { L: r('cL'), D: r('cD'), R: r('cR') };
}
function drawLogo(g, l, d, r) {
  g.L.setAttribute('y', 84 - 68 * l); g.L.setAttribute('height', 68 * l + .01);
  g.D.setAttribute('height', 68 * d + .01);
  g.R.setAttribute('y', 84 - 68 * r); g.R.setAttribute('height', 68 * r + .01);
}
const logo3 = logoSVG($('logo3'), 'a'), logo9 = logoSVG($('logo9'), 'b');
drawLogo(logo9, 1, 1, 1);

// ---------- shelves ----------
const rows = [];
{
  const list = window.POSTERS || [];
  [255, 735, 1215].forEach((y, r) => {
    const row = document.createElement('div'); row.className = 'row'; row.style.top = y + 'px';
    for (let i = 0; i < 14; i++) { const im = new Image(); im.src = list[(r * 11 + i * 2 + (r === 1 ? 1 : 0)) % list.length]; row.append(im); }
    $('shelves').append(row); rows.push(row);
  });
}

// ---------- words ----------
const WORDS = [[14.5, 'Free.'], [15.0, 'No sign-up.'], [15.5, '222 KB.'], [16.0, 'Just press <em class="grad">play.</em>']];
WORDS.forEach((w, i) => { const d = document.createElement('div'); d.className = i === 3 ? 'word small' : 'word'; d.innerHTML = `<span>${w[1]}</span>`; $('s8').append(d); w.el = d; });
// tab names for the tab tour
const TABS = [[8.5, 'Movies.', 'scrMovies', .254, .955], [9.0, 'Series.', 'scrSeries', .418, .955], [9.5, 'Anime.', 'scrAnime', .58, .955], [10.0, 'And what\'s <em class="grad">new.</em>', 'scrNew', .805, .034]];
TABS.forEach(w => { const d = document.createElement('div'); d.className = 'head'; d.style.top = '150px'; d.innerHTML = `<div class="hl"><span>${w[1]}</span></div>`; $('h5').append(d); w.el = d; });
ACCENTS.forEach(([a]) => { const i = document.createElement('i'); i.style.background = a; $('dots').append(i); });

// ---------- grain ----------
const gctx = $('grain').getContext('2d');
const tiles = [0, 1, 2, 3].map(i => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); const r = rng(100 + i); for (let p = 0; p < d.data.length; p += 4) { const v = 128 + (r() - .5) * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; } x.putImageData(d, 0, 0); return gctx.createPattern(c, 'repeat'); });

// ---------- helpers ----------
function reveal(head, t, tin, dur = .8) {
  [...head.querySelectorAll('.hl > span')].forEach((s, i) => {
    const a = E.out(P(t, tin + i * .08, tin + i * .08 + dur));
    css(s, { transform: `translateY(${(1 - a) * 105}%)`, opacity: clamp(a * 1.6) });
  });
}
function fadeUp(el, t, tin, dur = .7, dist = 24) {
  const a = E.out(P(t, tin, tin + dur));
  css(el, { opacity: a, transform: `translateY(${(1 - a) * dist}px)` });
}
const mask = (el, stops) => { el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(180deg, ${stops})`; };
const PH = { w: 556, h: 1162 };
// where to put the phone so screen point (u,v) lands at (X,Y) for scale s (rotation ignored)
const aim = (u, v, s, X, Y) => [X - (18 + u * 520 - PH.w / 2) * s, Y - (18 + v * 1126 - PH.h / 2) * s];

// ---------- frame ----------
function render(t) {
  const [A, B] = accentAt(t);
  document.documentElement.style.setProperty('--a', A);
  document.documentElement.style.setProperty('--b', B);

  const sc = name => within(t, S[name][0], S[name][1]);
  const phoneScene = sc('hindi') || sc('feed') || sc('tabs') || sc('play') || sc('end');
  $('spot').style.opacity = phoneScene ? 1 : sc('yours') ? .6 : 0;
  $('tint').style.opacity = sc('feed') || sc('tabs') || sc('play') ? .9 : sc('end') ? 1 : 0;

  // S1 library: three shelves drift, the middle one sharp
  show($('s1'), sc('lib'));
  if (sc('lib')) {
    const k = t;
    rows.forEach((r, i) => {
      const dir = i === 1 ? -1 : 1, base = i === 1 ? -560 : -360;
      r.style.transform = `translateX(${base + dir * 70 * k + (i === 1 ? 0 : -160 * i)}px)`;
    });
    css($('shelves'), { transform: `scale(${lerp(1.06, 1.0, E.out(P(t, 0, 2.5)))}) rotate(-4deg)` });
    mask($('dof1'), 'black 0%, black 30%, transparent 38%, transparent 62%, black 70%, black 100%');
    const f = E.smooth(P(t, 0, .45));
    $('s1').style.opacity = f;
    reveal($('h1'), t, .55);
  }

  // S3 brand
  show($('s3'), sc('brand'));
  if (sc('brand')) {
    const b0 = S.brand[0];
    drawLogo(logo3, E.out(P(t, b0 + .05, b0 + .55)), E.inOut(P(t, b0 + .3, b0 + .85)), E.out(P(t, b0 + .6, b0 + 1.1)));
    const drift = lerp(.96, 1.0, E.out(P(t, b0, b0 + 2)));
    $('logo3').style.transform = `scale(${drift})`;
    $('glow').style.opacity = E.smooth(P(t, b0, b0 + 1.2)) * .9;
    const w = E.out(P(t, b0 + .9, b0 + 1.7));
    css($('wm'), { opacity: w, letterSpacing: `${lerp(.42, .2, w)}em`, paddingLeft: `${lerp(.42, .2, w)}em` });
    fadeUp($('tag'), t, b0 + 1.2, .8, 14);
  }

  // phone
  const ph = phoneState(t);
  show($('pwrap'), !!ph); show($('shadow'), !!ph); show($('dofP'), !!(ph && ph.dof));
  if (ph) {
    css($('pwrap'), { transform: `translate(${ph.x - PH.w / 2}px, ${ph.y - PH.h / 2}px) scale(${ph.s})` });
    $('phone3d').style.transform = `rotateX(${ph.rx}deg) rotateY(${ph.ry}deg) rotateZ(${ph.rz}deg)`;
    $('glare').style.backgroundPosition = `${50 + ph.ry * 2.2 + ph.rz * .3}% 0`;
    css($('shadow'), { left: `${ph.x - 320}px`, top: `${ph.y + PH.h / 2 * ph.s - 30}px`, opacity: ph.shadow ?? 0, transform: `scale(${ph.s})` });
    if (ph.dof) mask($('dofP'), ph.dof);
    screens(t);
  }
  ['h2', 'sub2', 'h4', 'h6', 'sub6', 'h7'].forEach(id => show($(id), false));
  if (sc('hindi')) { show($('h2'), true); show($('sub2'), true); reveal($('h2'), t, S.hindi[0] + .1); fadeUp($('sub2'), t, S.hindi[0] + .65); }
  if (sc('feed')) { show($('h4'), true); reveal($('h4'), t, S.feed[0] + .1); }
  if (sc('play')) { show($('h6'), true); reveal($('h6'), t, S.play[0] + .1); show($('sub6'), true); fadeUp($('sub6'), t, 11.75); }
  TABS.forEach((w, i) => { const on = sc('tabs') && t >= w[0] && t < (TABS[i + 1] ? TABS[i + 1][0] : S.tabs[1]); show(w.el, on); if (on) reveal(w.el, t, w[0], .55); });

  // S7 make it yours
  show($('s7'), sc('yours'));
  if (sc('yours')) {
    show($('h7'), true); reveal($('h7'), t, S.yours[0] + .1);
    const y0 = S.yours[0], m = E.out(P(t, y0, y0 + 2));
    $('macroIn').style.transform = `rotateX(${lerp(22, 12, m)}deg) scale(${lerp(.9, 1.0, m)})`;
    const ai = accentIndex(t);
    [...$('macroIn').children].forEach((im, i) => { im.style.opacity = i === ai ? 1 : 0; });
    mask($('dof7'), 'black 0%, black 34%, transparent 42%, transparent 62%, black 74%, black 100%');
    [...$('dots').children].forEach((d, i) => {
      const a = E.out(P(t, y0 + .3 + i * .05, y0 + .8 + i * .05));
      const sel = i === ai;
      css(d, { opacity: a, transform: `translateY(${(1 - a) * 30}px) scale(${sel ? 1.06 : .86})`, boxShadow: sel ? '0 0 0 6px #000, 0 0 0 9px rgba(255,255,255,.95)' : 'none' });
    });
  }

  // S8 words, one per beat
  show($('s8'), sc('words'));
  WORDS.forEach((w, i) => {
    const on = sc('words') && t >= w[0] && t < (WORDS[i + 1] ? WORDS[i + 1][0] : S.words[1]);
    show(w.el, on);
    if (on) { const a = E.out(P(t, w[0], w[0] + .42)); css(w.el.firstChild, { transform: `translateY(${(1 - a) * 100}%) scale(${lerp(1.02, 1, a)})` }); }
  });

  // S9 end
  show($('s9'), sc('end'));
  if (sc('end')) {
    const e0 = S.end[0];
    fadeUp($('logo9'), t, e0 + .05, .9, 20);
    reveal($('h9'), t, e0 + .2, .9);
    const c = E.out(P(t, e0 + .55, e0 + 1.25));
    css($('cta'), { opacity: c, transform: `translateY(${(1 - c) * 26}px) scale(${lerp(.96, 1, c)})` });
    fadeUp($('meta'), t, e0 + .8, .8, 16);
  }
  $('fade').style.opacity = Math.max(1 - E.smooth(P(t, 0, .35)), E.smooth(P(t, 19.55, 20)));

  // grain
  const gi = Math.floor(t * 24) % 4;
  gctx.setTransform(1, 0, 0, 1, (gi * 97) % 256, (gi * 61) % 256);
  gctx.fillStyle = tiles[gi]; gctx.fillRect(-256, -256, 540 + 512, 960 + 512);
}

function phoneState(t) {
  if (within(t, ...S.hindi)) { // macro on the audio choice of a title
    const p = P(t, ...S.hindi), s = lerp(1.8, 1.92, p);
    const [x, y] = aim(.27, .44, s, 560 - p * 30, 1260);
    return { x, y, s, rx: 24, ry: -16 + p * 4, rz: -5, dof: 'black 0%, black 36%, transparent 54%, transparent 74%, black 90%, black 100%', shadow: 0 };
  }
  if (within(t, ...S.feed)) {
    const p = P(t, ...S.feed), e = E.out(P(t, 6.5, 7.4));
    return { x: 540, y: lerp(1260, 1190, e), s: lerp(.94, 1.0, E.out(p)), rx: lerp(14, 6, e), ry: lerp(-26, -12, e) + p * 4, rz: 0, shadow: .8 };
  }
  if (within(t, ...S.tabs)) {
    const p = P(t, ...S.tabs);
    return { x: 540, y: 1150, s: lerp(1.0, 1.04, p), rx: 0, ry: lerp(6, 2, p), rz: 0, shadow: .8 };
  }
  if (within(t, ...S.play)) {
    const turn = E.inOut(P(t, 11.25, 11.95));
    const s0 = 1.45, [x0, y0] = aim(.5, .33, s0, 540, 1080);
    const s = lerp(s0, .9, turn);
    return { x: lerp(x0, 540, turn), y: lerp(y0, 1000, turn), s, rx: lerp(10, 0, turn), ry: lerp(-10 + P(t, 10.5, 11.25) * 4, 0, turn), rz: lerp(0, -90, turn), shadow: 0 };
  }
  if (within(t, ...S.end)) {
    const e = E.out(P(t, 16.6, 17.8));
    return { x: 540, y: lerp(2300, 1640, e), s: 1, rx: 0, ry: 0, rz: 0, shadow: 0 };
  }
  return null;
}

function screens(t) {
  const on = id => { [...$('glass').querySelectorAll('.scr')].forEach(s => s.style.display = s.id === id ? '' : 'none'); };
  const tapAt = (ti, u, v) => {
    const a = P(t, ti - .14, ti), b = P(t, ti, ti + .22);
    if (t < ti - .14 || t > ti + .22) return false;
    css($('tap'), { left: `${u * 520}px`, top: `${v * 1126}px`, opacity: E.out(a) * (1 - b), transform: `scale(${lerp(1.3, 1, E.out(a)) * (b > 0 ? .84 : 1)})` });
    return true;
  };
  let tapped = false;
  if (within(t, ...S.hindi)) { on('scrTitle'); tapped = tapAt(3.35, .087, .442); }
  else if (within(t, ...S.feed)) {
    on('scrHome');
    const scroll = keys(t, [[7.0, 0], [8.45, 980, 'inOut']]);
    $('homeTall').style.transform = `translateY(${-scroll * 520 / 412}px)`;
    $('topbar').style.transform = `translateY(${-E.out(P(scroll, 0, 140)) * 100}%)`;
  } else if (within(t, ...S.tabs)) {
    let cur = TABS[0];
    for (const w of TABS) if (t >= w[0] - .02) cur = w;
    on(cur[2]);
    const next = TABS[TABS.indexOf(cur) + 1];
    if (next) tapped = tapAt(next[0] - .02, next[3], next[4]);
  } else if (within(t, ...S.play)) {
    on(t < 11.55 ? 'scrTitleA' : 'scrVideo');
    tapped = tapAt(11.05, .5, .35);
    if (t >= 11.55) $('vid').style.opacity = E.smooth(P(t, 11.55, 11.75));
  } else if (within(t, ...S.end)) on('scrHome2');
  if (!tapped) $('tap').style.opacity = 0;
}

async function ready() {
  await document.fonts.load('700 100px "Inter Tight"');
  await document.fonts.load('italic 100px "Instrument Serif"');
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  return true;
}
window.render = render; window.ready = ready;
const q = new URLSearchParams(location.search);
if (q.has('t')) ready().then(() => render(+q.get('t')));
</script>
</body>
