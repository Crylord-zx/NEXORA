<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexora trailer</title>
<!--
  Nexora 20-second trailer. render(t) draws second t as a pure function of time, so render.js can step
  through it with sub-frames for motion blur. window.CUTS lists the hard cuts blur must not cross.
  Open showreel.html?t=12.3 to look at one moment. The last 2.5 s replay the app's own launch splash,
  with the same drawing, timings and curves as assets/index.html in the APK.
-->
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:block;src:url(cache/fonts/Archivo.woff2) format('woff2');}
@font-face{font-family:'JB';font-style:normal;font-weight:400 700;font-display:block;src:url(cache/fonts/JetBrainsMono.woff2) format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:block;src:url(cache/fonts/Inter.woff2) format('woff2');}
@font-face{font-family:'Serif';font-style:italic;font-weight:400;font-display:block;src:url(cache/fonts/InstrumentSerif-400-italic.woff2) format('woff2');}
:root{--red:#e81b43;--deep:#b3092b;--violet:#7b1fa2;--hud:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
body{color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.L{position:absolute;inset:0;overflow:hidden}
.disp{font-family:'Archivo';font-weight:900;font-stretch:125%;letter-spacing:-.035em;line-height:.86;white-space:nowrap;text-transform:uppercase}
.cond{font-stretch:72%;letter-spacing:-.02em}
.mono{font-family:'JB';font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.center{position:absolute;left:0;right:0;text-align:center}
.serif{font-family:'Serif';font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em}

/* A: cold open */
#presents{top:930px;font-family:'Archivo';font-weight:500;font-stretch:125%;font-size:30px;letter-spacing:.62em;padding-left:.62em}
#flare{position:absolute;left:540px;top:1000px;height:3px;width:10px;translate:-50% -50%;border-radius:2px;background:linear-gradient(90deg,transparent,#ff2e55 18%,#fff 50%,#ff2e55 82%,transparent);box-shadow:0 0 18px 4px rgba(255,46,85,.8),0 0 60px 14px rgba(255,46,85,.35)}
#bloom{position:absolute;left:540px;top:1000px;width:1400px;height:240px;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,60,100,.55),rgba(180,30,90,.18) 55%,transparent)}

/* B: words */
.wordcard{position:absolute;inset:0;display:none}
.wordcard .w{position:absolute;left:0;right:0;top:50%;text-align:center}
.wordcard .tag{position:absolute;left:72px;top:640px;font-size:24px}
.wordcard .rule{position:absolute;left:72px;right:72px;height:2px;top:1290px}

/* C: montage */
.shot{position:absolute;inset:0;display:none;overflow:hidden}
.shot img{position:absolute;left:-100px;top:0;width:1280px;height:1920px;object-fit:cover}
.shot .shade{position:absolute;inset:0;background:radial-gradient(90% 34% at 50% 52%,rgba(0,0,0,.6),transparent 70%),linear-gradient(180deg,rgba(0,0,0,.55),transparent 25%,transparent 70%,rgba(0,0,0,.8))}
.shot .cap{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:200px;text-shadow:0 20px 80px rgba(0,0,0,.6)}
#grid{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px;display:none}
#grid img{position:absolute;width:200px;height:300px;border-radius:10px;object-fit:cover}
#gridShade{position:absolute;inset:0;background:#000;opacity:0;display:none}

/* phone */
#pwrap{position:absolute;left:0;top:0;width:556px;height:1162px;perspective:2600px;transform-origin:50% 50%;display:none}
#phone3d{position:absolute;inset:0;transform-style:preserve-3d}
.frame{position:absolute;inset:0;border-radius:80px;padding:12px;background:linear-gradient(135deg,#e3e3e8 0%,#77777e 9%,#2e2e33 24%,#18181b 60%,#55555b 88%,#d0d0d6 100%);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 90px 120px -40px rgba(0,0,0,.95)}
.frame::before{content:"";position:absolute;inset:2px;border-radius:78px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.btn{position:absolute;width:6px;border-radius:3px;background:linear-gradient(90deg,#5a5a60,#c9c9cf)}
.bezel{position:relative;width:100%;height:100%;border-radius:68px;padding:6px;background:#020203}
#glass{position:relative;width:520px;height:1126px;border-radius:62px;overflow:hidden;background:#000}
#glass > img{position:absolute;left:0;top:0;width:520px}
#island{position:absolute;left:50%;top:20px;width:126px;height:36px;margin-left:-63px;border-radius:20px;background:#000}
#glare{position:absolute;inset:0;border-radius:62px;background:linear-gradient(118deg,transparent 30%,rgba(255,255,255,.08) 44%,transparent 58%);background-size:260% 100%}
.num{position:absolute;font-family:'Archivo';font-weight:900;font-stretch:100%;font-size:300px;line-height:1;color:transparent;-webkit-text-stroke:5px #fff;translate:-50% -50%;display:none}
#appHead{display:none}

/* F: glass control */
#hindiBg{position:absolute;inset:0;display:none}
#hindiBg img{position:absolute;left:-100px;top:0;width:1280px;height:1920px;object-fit:cover}
#hindiBg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.1) 40%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.85))}
#seg{position:absolute;left:90px;right:90px;top:1300px;height:150px;border-radius:75px;padding:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1.5px rgba(255,255,255,.22),0 40px 80px rgba(0,0,0,.45)}
#seg .opt{position:absolute;top:14px;height:122px;width:calc((100% - 28px)/3);display:grid;place-items:center;font-family:'Inter';font-weight:650;font-size:44px;letter-spacing:-.02em;z-index:2}
#seg .pill{position:absolute;top:14px;height:122px;width:calc((100% - 28px)/3);border-radius:61px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#segLabel{position:absolute;left:130px;top:1250px;font-size:24px;opacity:.8}
.touch{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.9),0 8px 30px rgba(0,0,0,.4);opacity:0;z-index:5}

/* G: play */
#playBox{position:absolute;left:540px;top:960px;overflow:hidden;background:#fff;display:none}
#playBox img{position:absolute;left:50%;top:50%;width:1080px;height:608px;translate:-50% -50%;object-fit:cover}
#playLabel{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;align-items:center;gap:22px;font-family:'Inter';font-weight:700;font-size:56px;color:#000;white-space:nowrap}
#playLabel svg{width:44px;height:44px}
#prog{position:absolute;left:40px;right:40px;bottom:34px;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--red)}

/* H: yours */
#ringWin{position:absolute;left:540px;top:960px;width:620px;height:620px;translate:-50% -50%;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 50px 120px rgba(0,0,0,.45)}
#ringWin img{position:absolute;left:50%;top:50%;width:860px;height:860px;translate:-50% -51.5%;}

/* iris */
#iris{position:absolute;inset:0;pointer-events:none;display:none}

/* J: the app splash */
#splash{position:absolute;inset:0;background:#000;display:none}
#splash .brand{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center}
#splash svg{width:324px;height:480px;overflow:visible}
#spWord{margin:76px 0 0 .42em;font-family:'Inter';font-size:65px;font-weight:800;letter-spacing:.42em;color:#fff}
#spTag{margin:26px 0 0 .38em;font-family:'Inter';font-size:26px;font-weight:600;letter-spacing:.38em;color:#8a8ca2}
#spCta{position:absolute;left:0;right:0;top:1690px;text-align:center;font-family:'Inter';font-weight:600;font-size:30px;letter-spacing:.02em;color:#c9cad6}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;color:var(--hud)}
#hud .c{position:absolute;width:44px;height:44px;border-color:var(--hud);border-style:solid;border-width:0;opacity:.75}
#hud .t{position:absolute;font-size:22px;opacity:.78}
#hud .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:12px;vertical-align:1px}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.08;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 65% at 50% 50%,transparent 58%,rgba(0,0,0,.42))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="L" id="bgField"></div>

  <!-- A: cold open -->
  <div class="L" id="sA"><div id="bloom"></div><div id="flare"></div><div class="center" id="presents">NEXORA PRESENTS</div></div>

  <!-- B: words on colour fields (built in script) -->
  <div class="L" id="sB"></div>

  <!-- C: montage and the pull-back to the grid -->
  <div class="L" id="sC"><div id="grid"></div><div id="gridShade"></div></div>

  <!-- D/E: the app -->
  <div class="L" id="sD">
    <div id="appHead"></div>
    <div id="pwrap"><div id="phone3d"><div class="frame">
      <i class="btn" style="left:-4px;top:250px;height:60px"></i><i class="btn" style="left:-4px;top:340px;height:110px"></i><i class="btn" style="right:-4px;top:360px;height:170px"></i>
      <div class="bezel"><div id="glass"><img id="homeTall" src="shots/home_tall.jpg"><img id="topbar" src="shots/topbar.png"><img src="shots/tabbar.png" style="top:1046.5px"><div id="island"></div><div id="glare"></div></div></div>
    </div></div></div>
    <div class="num" id="n1">1</div><div class="num" id="n2">2</div><div class="num" id="n3">3</div>
  </div>

  <!-- F: the audio choice -->
  <div class="L" id="sF">
    <div id="hindiBg"><img id="hindiImg"><div class="shade"></div></div>
    <div class="center disp" id="fHead1" style="top:250px;font-size:250px">HINDI,</div>
    <div class="center disp" id="fHead2" style="top:470px;font-size:250px">FIRST.</div>
    <div class="mono" id="segLabel">Audio</div>
    <div id="seg"><div class="pill" id="segPill"></div><div class="opt" style="left:14px" id="o0">Hindi</div><div class="opt" style="left:calc(14px + (100% - 28px)/3)" id="o1">English</div><div class="opt" style="left:calc(14px + 2*(100% - 28px)/3)" id="o2">Original</div></div>
    <div class="center" id="fSub" style="top:1500px;font-family:'Inter';font-weight:500;font-size:40px;color:#d9d9e0">Pick it once. Nexora remembers.</div>
    <div class="touch" id="touchF"></div>
  </div>

  <!-- G: one tap -->
  <div class="L" id="sG">
    <div class="center disp" id="gHead" style="top:330px;font-size:200px">ONE TAP.</div>
    <div id="playBox"><img id="playImg" src="shots/player_video.jpg"><div id="playLabel"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="#000"/></svg>Play</div><div id="prog"><i></i></div></div>
    <div class="center mono" id="gUp" style="top:1330px;font-size:28px;opacity:.75">Up to</div>
    <div class="center disp" id="gRes" style="top:1380px;font-size:230px">480P</div>
    <div class="touch" id="touchG"></div>
  </div>

  <!-- H: make it yours -->
  <div class="L" id="sH">
    <div class="center disp" id="hTop" style="top:250px;font-size:210px">MAKE IT</div>
    <div id="ringWin"><img id="ringImg" src="shots/ring_rose.jpg"></div>
    <div class="center disp" id="hBot" style="top:1450px;font-size:210px">YOURS.</div>
    <div class="center mono" id="hHex" style="top:1360px;font-size:26px">#FF2D55 · ROSE</div>
  </div>

  <!-- I: last words -->
  <div class="L" id="sI"></div>

  <!-- J: the app's own launch splash -->
  <div id="splash">
    <div class="brand" id="spBrand">
      <svg viewBox="0 0 540 800" aria-hidden="true"><defs>
        <linearGradient id="spLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E81B43"/><stop offset="0.6" stop-color="#B3092B"/><stop offset="1" stop-color="#600315"/></linearGradient>
        <linearGradient id="spRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C27B0"/><stop offset="0.5" stop-color="#7B1FA2"/><stop offset="1" stop-color="#4A0E6B"/></linearGradient>
        <linearGradient id="spFold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2E55"/><stop offset="0.42" stop-color="#E01E78"/><stop offset="0.75" stop-color="#BA28C7"/><stop offset="1" stop-color="#9C27B0"/></linearGradient>
        <linearGradient id="spShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF" stop-opacity="0.5"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
        <filter id="spShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-18" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.95"/></filter>
        <mask id="spReveal" maskUnits="userSpaceOnUse" x="-80" y="-40" width="700" height="880"><rect id="spWipe" x="-80" y="-40" width="700" height="880" fill="#FFF"/></mask>
        <clipPath id="spShape"><rect width="155" height="800" rx="8"/><rect x="385" width="155" height="800" rx="8"/><polygon points="0,0 155,0 540,800 385,800"/></clipPath>
      </defs>
      <rect id="spL" width="155" height="800" rx="8" fill="url(#spLeft)"/>
      <rect id="spR" x="385" width="155" height="800" rx="8" fill="url(#spRight)"/>
      <g mask="url(#spReveal)"><polygon points="0,0 155,0 540,800 385,800" fill="url(#spFold)" filter="url(#spShadow)"/></g>
      <g clip-path="url(#spShape)"><rect id="spS" y="-20" width="170" height="840" fill="url(#spShine)"/></g>
      </svg>
      <div id="spWord">NEXORA</div>
      <div id="spTag">DEVELOPED BY ANSHXR.YN</div>
    </div>
    <div id="spCta">Free on Android</div>
  </div>

  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vig"></div>
  <div id="iris"></div>
  <div id="hud">
    <i class="c" style="left:48px;top:48px;border-left-width:3px;border-top-width:3px"></i>
    <i class="c" style="right:48px;top:48px;border-right-width:3px;border-top-width:3px"></i>
    <i class="c" style="left:48px;bottom:48px;border-left-width:3px;border-bottom-width:3px"></i>
    <i class="c" style="right:48px;bottom:48px;border-right-width:3px;border-bottom-width:3px"></i>
    <div class="t mono" style="left:110px;top:62px">Nexora <span style="opacity:.5">/ Trailer</span></div>
    <div class="t mono" style="right:110px;top:62px"><span class="dot" id="rec"></span>Now streaming</div>
    <div class="t mono" style="left:110px;bottom:62px" id="tc">00:00:00:00</div>
    <div class="t mono" style="right:110px;bottom:62px" id="scene">01 · Cold open</div>
  </div>
  <div id="flash"></div>
</div>

<script src="cache/posters780.js"></script>
<script>
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
function bezier(x1, y1, x2, y2) { // CSS cubic-bezier, solved for x
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s, Y = s => ((ay * s + by) * s + cy) * s, dX = s => (3 * ax * s + 2 * bx) * s + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const d = dX(s); if (Math.abs(d) < 1e-6) break; s -= (X(s) - x) / d; } return Y(clamp(s)); };
}
const E = {
  out: bezier(.16, 1, .3, 1),          // the app's own curve
  inOut: bezier(.65, 0, .35, 1),
  shine: bezier(.4, 0, .2, 1),
  snap: x => x >= 1 ? 1 : 1 - Math.pow(2, -12 * x),
  in: x => x * x * x,
  smooth: x => x * x * (3 - 2 * x),
  back: x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
function keys(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e] = k[i]; return lerp(v0, v1, (E[e] || E.inOut)((t - t0) / (t1 - t0))); }
  return k[k.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = id => document.getElementById(id);
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, on) => { el.style.display = on ? 'block' : 'none'; };
const within = (t, a, b) => t >= a && t < b;
const P780 = name => `cache/posters780/${name}`;

// ---------- timeline ----------
const S = { A: [0, 2], B: [2, 4], C: [4, 6], D: [6, 8], E: [8, 10], F: [10, 12], G: [12, 14], H: [14, 16], I: [16, 17.5], J: [17.5, 20] };
const RED = '#e81b43', VIOLET = '#7b1fa2';

// B: four words, four fields
const WORDS_B = [
  { t: 2.0, text: 'PRESS', bg: RED, fg: '#000', tag: '[01]  Press' },
  { t: 2.5, text: 'PLAY', bg: '#000', fg: '#fff', tag: '[02]  Play', tri: true },
  { t: 3.0, text: 'ON', bg: VIOLET, fg: '#fff', tag: '[03]  On' },
  { t: 3.5, text: 'everything.', bg: '#000', fg: '#fff', tag: '[04]  Everything', serif: true },
];
WORDS_B.forEach((w, i) => {
  const d = document.createElement('div'); d.className = 'wordcard';
  d.innerHTML = `<div class="tag mono" style="color:${w.fg};opacity:.7">${w.tag}</div><div class="w ${w.serif ? 'serif' : 'disp'}" style="color:${w.fg}">${w.serif ? '<span style="background:linear-gradient(95deg,#ff2e55,#ba28c7);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em">' + w.text + '</span>' : w.text}</div><div class="rule" style="background:${w.fg};opacity:.25"></div>`;
  if (w.tri) d.innerHTML += `<svg viewBox="0 0 100 100" style="position:absolute;left:540px;top:1520px;width:260px;height:260px;translate:-50% -50%" id="triB"><path d="M28 14v72l60-36z" fill="${RED}"/></svg>`;
  $('sB').append(d); w.el = d; w.word = d.querySelector('.w');
});

// C: montage
const MONT = [
  { t: 4.0, img: '0', cap: 'EVERY' }, { t: 4.25, img: '3', cap: 'STORY.' }, { t: 4.5, img: '2', cap: 'EVERY' },
  { t: 4.75, img: '12', cap: 'GENRE.' }, { t: 5.0, img: '31', cap: 'ONE' }, { t: 5.25, img: '24', cap: 'APP.' },
];
const list = window.P780 || [];
MONT.forEach(m => {
  const d = document.createElement('div'); d.className = 'shot';
  d.innerHTML = `<img src="${list[+m.img]}"><div class="shade"></div><div class="cap disp">${m.cap}</div>`;
  $('sC').insertBefore(d, $('grid')); m.el = d; m.im = d.querySelector('img'); m.capEl = d.querySelector('.cap');
});
// the grid the last poster pulls back into: 5 x 7 cells, centre cell = the last montage poster
const GRID = { cols: 5, rows: 7, w: 200, h: 300, gap: 12 };
{
  const skip = new Set();
  const pool = list.map((src, i) => [src, i]).filter(([, i]) => !skip.has(i) && i !== 24);
  const rr = rng(5), order = pool.map(p => p[0]).sort(() => rr() - .5);
  let k = 0;
  const gw = GRID.cols * GRID.w + (GRID.cols - 1) * GRID.gap, gh = GRID.rows * GRID.h + (GRID.rows - 1) * GRID.gap;
  for (let r = 0; r < GRID.rows; r++) for (let c = 0; c < GRID.cols; c++) {
    const im = new Image();
    const centre = r === 3 && c === 2;
    im.src = centre ? list[24] : order[k++ % order.length];
    im.style.left = (540 - gw / 2 + c * (GRID.w + GRID.gap)) + 'px';
    im.style.top = (960 - gh / 2 + r * (GRID.h + GRID.gap)) + 'px';
    im.dataset.r = r; im.dataset.c = c;
    $('grid').append(im);
  }
}

$('hindiImg').src = list[4];

// I: last words
const WORDS_I = [
  { t: 16.0, text: 'FREE.', bg: '#000', fg: '#fff', tag: '[05]  Price' },
  { t: 16.5, text: 'NO SIGN-UP.', bg: RED, fg: '#000', tag: '[06]  Accounts' },
  { t: 17.0, text: '222 KB.', bg: '#000', fg: '#fff', tag: '[07]  Download' },
];
WORDS_I.forEach(w => {
  const d = document.createElement('div'); d.className = 'wordcard';
  d.innerHTML = `<div class="tag mono" style="color:${w.fg};opacity:.7">${w.tag}</div><div class="w disp" style="color:${w.fg}">${w.text}</div><div class="rule" style="background:${w.fg};opacity:.25"></div>`;
  $('sI').append(d); w.el = d; w.word = d.querySelector('.w');
});

// H: accent fields
const ACC = [
  { t: 14.0, bg: '#ff2d55', img: 'rose', hex: '#FF2D55 · ROSE', fg: '#000' },
  { t: 14.4, bg: '#a06bff', img: 'violet', hex: '#A06BFF · VIOLET', fg: '#000' },
  { t: 14.8, bg: '#2fa8ff', img: 'ocean', hex: '#2FA8FF · OCEAN', fg: '#000' },
  { t: 15.2, bg: '#2bd17e', img: 'emerald', hex: '#2BD17E · EMERALD', fg: '#000' },
  { t: 15.6, bg: '#f5b83d', img: 'gold', hex: '#F5B83D · GOLD', fg: '#000' },
];
const ringImgs = {}; ACC.forEach(a => { const im = new Image(); im.src = `shots/ring_${a.img}.jpg`; ringImgs[a.img] = im; });

// D/E: headlines over the app
$('appHead').innerHTML = `
  <div class="center disp" id="dH1" style="top:200px;font-size:190px">ALL OF IT.</div>
  <div class="center disp" id="dH2" style="top:380px;font-size:190px;color:${RED}">ONE APP.</div>
  <div class="center disp" id="eH1" style="top:180px;font-size:340px;color:${RED}">TOP 10</div>
  <div class="center mono" id="eH2" style="top:500px;font-size:28px">In India · This month</div>`;
$('appHead').style.position = 'absolute'; $('appHead').style.inset = '0';

const SCENE_LABEL = [[0, '01 · Cold open'], [2, '02 · Title'], [4, '03 · Library'], [6, '04 · The app'], [8, '05 · Top 10'], [10, '06 · Audio'], [12, '07 · Play'], [14, '08 · Yours'], [16, '09 · Free']];

// ---------- grain ----------
const gctx = $('grain').getContext('2d');
const tiles = [0, 1, 2, 3].map(i => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); const r = rng(100 + i); for (let p = 0; p < d.data.length; p += 4) { const v = 128 + (r() - .5) * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; } x.putImageData(d, 0, 0); return gctx.createPattern(c, 'repeat'); });

// fit a line of display type to a width
const _range = document.createRange();
function fit(el, width) {
  if (el.dataset.fitW == width && el.dataset.fitT === el.textContent) return;
  el.style.fontSize = '100px'; _range.selectNodeContents(el);
  const w = _range.getBoundingClientRect().width;
  el.style.fontSize = (100 * width / w) + 'px'; el.dataset.fitW = width; el.dataset.fitT = el.textContent;
}

// ---------- frame ----------
const PH = { w: 556, h: 1162 };
const aim = (u, v, s, X, Y) => [X - (18 + u * 520 - PH.w / 2) * s, Y - (18 + v * 1126 - PH.h / 2) * s];

function render(t) {
  const sc = k => within(t, S[k][0], S[k][1]);
  let bg = '#000', hud = '#fff';

  // A: cold open
  show($('sA'), sc('A'));
  if (sc('A')) {
    const p = E.smooth(P(t, .35, .95));
    const flick = t < 1.0 ? (Math.sin(t * 90) > .2 ? 1 : .55) : 1;
    css($('presents'), { opacity: p * flick * (1 - E.in(P(t, 1.75, 2))), letterSpacing: `${lerp(.9, .62, E.out(P(t, .35, 1.9)))}em` });
    const f = E.in(P(t, 1.0, 1.97));
    css($('flare'), { width: `${10 + f * 1700}px`, opacity: P(t, 1.0, 1.15), height: `${2 + f * 3}px` });
    css($('bloom'), { opacity: f * .9, transform: `scaleX(${.3 + f})` });
  }

  // B: words
  show($('sB'), sc('B'));
  WORDS_B.forEach((w, i) => {
    const end = WORDS_B[i + 1] ? WORDS_B[i + 1].t : S.B[1];
    const on = t >= w.t && t < end; show(w.el, on);
    if (!on) return;
    bg = w.bg; hud = w.fg;
    fit(w.word, w.serif ? 1000 : 960);
    const a = E.snap(P(t, w.t, w.t + .22));
    const dir = i % 2 ? -1 : 1;
    if (w.serif) {
      css(w.word, { transform: `translate(${(1 - a) * 900}px, -50%) scale(${lerp(1.25, 1, E.out(P(t, w.t, w.t + .5)))})`, letterSpacing: `${lerp(.12, -.02, E.out(P(t, w.t, w.t + .5)))}em` });
    } else {
      const drift = (t - w.t) * 40 * dir;
      css(w.word, { transform: `translate(${(1 - a) * 1300 * dir + drift}px, -50%) skewX(${(1 - a) * -14 * dir}deg)` });
    }
    const r = w.el.querySelector('.rule'); r.style.transform = `scaleX(${E.out(P(t, w.t + .05, w.t + .45))})`; r.style.transformOrigin = dir > 0 ? 'left' : 'right';
    const tri = w.el.querySelector('#triB');
    if (tri) tri.style.transform = `scale(${E.back(P(t, w.t + .12, w.t + .42))}) rotate(${(1 - E.out(P(t, w.t + .12, w.t + .42))) * -90}deg)`;
  });

  // C: montage, then the pull-back
  show($('sC'), sc('C') || within(t, 6, 6.8));
  MONT.forEach((m, i) => {
    const end = MONT[i + 1] ? MONT[i + 1].t : 5.5;
    const on = t >= m.t && t < end; show(m.el, on);
    if (!on) return;
    fit(m.capEl, 920);
    const p = P(t, m.t, end);
    m.im.style.transform = `scale(${lerp(1.14, 1.04, E.out(p))}) translateY(${(i % 2 ? -1 : 1) * p * 24}px)`;
    const a = E.snap(P(t, m.t, m.t + .12));
    css(m.capEl, { transform: `translateY(-50%) scale(${lerp(1.5, 1, a)})`, opacity: a });
  });
  const gridOn = t >= 5.5 && t < 6.8; show($('grid'), gridOn); show($('gridShade'), gridOn);
  if (gridOn) {
    const z = E.inOut(P(t, 5.5, 6.05));
    const s = lerp(6.4, 1, z);
    const tilt = E.inOut(P(t, 6.0, 6.7));
    $('grid').style.transform = `perspective(1800px) translateY(${tilt * -260}px) rotateX(${tilt * 52}deg) rotateZ(${tilt * -14}deg) scale(${s * lerp(1, 1.35, tilt)})`;
    $('gridShade').style.opacity = tilt * .72;
    [...$('grid').children].forEach(im => { const r = +im.dataset.r, c = +im.dataset.c; const d = Math.hypot(r - 3, c - 2); im.style.opacity = clamp((z * 4.5 - d * .55)); });
  }

  // D/E: the app
  const appOn = within(t, 6.15, 10.0); show($('sD'), appOn); show($('pwrap'), appOn); show($('appHead'), appOn);
  if (appOn) renderApp(t);

  // F: audio
  show($('sF'), sc('F')); show($('hindiBg'), sc('F'));
  if (sc('F')) {
    const f0 = 10;
    $('hindiBg').querySelector('img').style.transform = `scale(${lerp(1.18, 1.06, E.out(P(t, f0, 12)))})`;
    const h1 = E.snap(P(t, f0, f0 + .25)), h2 = E.snap(P(t, f0 + .12, f0 + .37));
    css($('fHead1'), { transform: `translateX(${(1 - h1) * -1200}px)` });
    css($('fHead2'), { transform: `translateX(${(1 - h2) * 1200}px)` });
    fit($('fHead1'), 900); fit($('fHead2'), 900);
    const sIn = E.out(P(t, f0 + .25, f0 + .85));
    css($('seg'), { opacity: sIn, transform: `translateY(${(1 - sIn) * 80}px) scale(${lerp(.92, 1, sIn)})` });
    css($('segLabel'), { opacity: sIn * .8 });
    // the selection: Original, then a tap on Hindi
    const slide = E.out(P(t, 10.95, 11.4));
    const segW = (1080 - 180 - 28) / 3;
    $('segPill').style.left = `${14 + lerp(2, 0, slide) * segW}px`;
    ['o0', 'o1', 'o2'].forEach((id, i) => { const sel = slide > .5 ? i === 0 : i === 2; $(id).style.color = sel ? '#000' : '#fff'; });
    const ta = P(t, 10.7, 10.9), tb = P(t, 10.9, 11.12);
    css($('touchF'), { left: `${90 + 14 + segW / 2}px`, top: `${1375}px`, opacity: (t > 10.7 && t < 11.12) ? E.out(ta) * (1 - tb) : 0, transform: `scale(${lerp(1.4, 1, E.out(ta)) * (tb > 0 ? .85 : 1)})` });
    fadeUp($('fSub'), t, 11.25, .6, 24);
  }

  // G: one tap
  show($('sG'), sc('G')); show($('playBox'), sc('G'));
  if (sc('G')) {
    const g0 = 12;
    bg = '#000';
    const hIn = E.snap(P(t, g0, g0 + .25));
    css($('gHead'), { transform: `translateY(${(1 - hIn) * 160}px)`, opacity: hIn });
    fit($('gHead'), 900);
    const pin = E.back(P(t, g0 + .05, g0 + .4));
    const press = t > 12.45 && t < 12.55 ? .94 : 1;
    const m = E.inOut(P(t, 12.55, 13.0));
    const w = lerp(560, 1080, m), h = lerp(150, 608, m), r = lerp(75, 0, m);
    css($('playBox'), { width: `${w}px`, height: `${h}px`, borderRadius: `${r}px`, transform: `translate(-50%,-50%) scale(${pin * press})`, background: m > .3 ? '#000' : '#fff' });
    css($('playLabel'), { opacity: 1 - P(t, 12.55, 12.75) });
    css($('playImg'), { opacity: E.smooth(P(t, 12.7, 13.0)), transform: `scale(${lerp(1.2, 1.04, E.out(P(t, 12.7, 14)))})` });
    $('prog').style.opacity = P(t, 12.95, 13.1);
    $('prog').firstChild.style.width = `${lerp(2, 38, P(t, 13, 14))}%`;
    const ta = P(t, 12.25, 12.45), tb = P(t, 12.45, 12.65);
    css($('touchG'), { left: '560px', top: '968px', opacity: (t > 12.25 && t < 12.65) ? E.out(ta) * (1 - tb) : 0, transform: `scale(${lerp(1.4, 1, E.out(ta)) * (tb > 0 ? .85 : 1)})` });
    const rIn = E.out(P(t, 13.05, 13.4));
    css($('gUp'), { opacity: rIn * .75 }); css($('gRes'), { opacity: rIn, transform: `translateY(${(1 - rIn) * 60}px)` });
    const res = t < 13.25 ? '480P' : t < 13.45 ? '720P' : '1080P';
    if ($('gRes').textContent !== res) $('gRes').textContent = res;
    fit($('gRes'), 760);
  }

  // H: make it yours
  show($('sH'), sc('H'));
  if (sc('H')) {
    let cur = ACC[0]; for (const a of ACC) if (t >= a.t) cur = a;
    bg = cur.bg; hud = cur.fg;
    if ($('ringImg').dataset.k !== cur.img) { $('ringImg').src = ringImgs[cur.img].src; $('ringImg').dataset.k = cur.img; }
    const a = E.snap(P(t, cur.t, cur.t + .2));
    const k = ACC.indexOf(cur);
    css($('ringWin'), { transform: `scale(${lerp(.86, 1, a) * (1 + (t - 14) * .03)}) rotate(${(1 - a) * (k % 2 ? 8 : -8)}deg)` });
    [$('hTop'), $('hBot')].forEach((el, i) => { el.style.color = cur.fg; fit(el, 900); el.style.transform = `translateX(${(i ? 1 : -1) * (1 - E.snap(P(t, 14, 14.25))) * 1200 + (i ? -1 : 1) * (t - 14) * 30}px)`; });
    css($('hHex'), { color: cur.fg, opacity: .75 }); $('hHex').textContent = cur.hex;
  }

  // I: last words
  show($('sI'), sc('I'));
  WORDS_I.forEach((w, i) => {
    const end = WORDS_I[i + 1] ? WORDS_I[i + 1].t : S.I[1];
    const on = t >= w.t && t < end; show(w.el, on);
    if (!on) return;
    bg = w.bg; hud = w.fg;
    fit(w.word, 940);
    const a = E.snap(P(t, w.t, w.t + .2));
    w.word.style.transform = `translateY(calc(-50% + ${(1 - a) * 260}px)) scale(${lerp(1.1, 1, a) + (t - w.t) * .04})`;
    const r = w.el.querySelector('.rule'); r.style.transform = `scaleX(${E.out(P(t, w.t + .05, w.t + .45))})`; r.style.transformOrigin = 'left';
  });
  // iris closes into the splash
  const ir = P(t, 17.2, 17.5);
  show($('iris'), ir > 0 && t < 17.5);
  if (ir > 0) { const rad = lerp(1300, 0, E.inOut(ir)); $('iris').style.background = `radial-gradient(circle at 540px 960px, transparent ${rad}px, #e81b43 ${rad + 1}px, #e81b43 ${rad + 6}px, #000 ${rad + 9}px)`; }

  // J: splash
  show($('splash'), sc('J'));
  if (sc('J')) renderSplash(t - S.J[0]);

  $('bgField').style.background = bg;
  // HUD
  const hudOn = t > .25 && t < 17.45;
  css($('hud'), { opacity: hudOn ? E.smooth(P(t, .25, .8)) : 0 });
  document.documentElement.style.setProperty('--hud', hud);
  const f = Math.floor(t * 30), ss = Math.floor(f / 30) % 60, ff = f % 30;
  $('tc').textContent = `00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`;
  let lab = SCENE_LABEL[0][1]; for (const [s, l] of SCENE_LABEL) if (t >= s) lab = l; $('scene').textContent = lab;
  $('rec').style.opacity = Math.floor(t * 2) % 2 ? .35 : 1;
  $('flash').style.opacity = Math.max(.9 * Math.exp(-(t - 2) * 18) * (t >= 2 ? 1 : 0), .5 * Math.exp(-(t - 4) * 20) * (t >= 4 ? 1 : 0), .35 * Math.exp(-(t - 10) * 18) * (t >= 10 ? 1 : 0));
  // grain
  const gi = Math.floor(t * 24) % 4;
  gctx.setTransform(1, 0, 0, 1, (gi * 97) % 256, (gi * 61) % 256);
  gctx.fillStyle = tiles[gi]; gctx.fillRect(-256, -256, 540 + 512, 960 + 512);
}

function fadeUp(el, t, tin, dur = .7, dist = 24) { const a = E.out(P(t, tin, tin + dur)); css(el, { opacity: a, transform: `translateY(${(1 - a) * dist}px)` }); }

function renderApp(t) {
  // headlines
  const d1 = E.snap(P(t, 6.35, 6.6)), d2 = E.snap(P(t, 6.5, 6.75));
  const dOut = E.in(P(t, 7.85, 8.0));
  show($('dH1'), t < 8); show($('dH2'), t < 8);
  css($('dH1'), { transform: `translateX(${(1 - d1) * -1200}px)`, opacity: 1 - dOut });
  css($('dH2'), { transform: `translateX(${(1 - d2) * 1200}px)`, opacity: 1 - dOut });
  fit($('dH1'), 880); fit($('dH2'), 880);
  show($('eH1'), t >= 8); show($('eH2'), t >= 8);
  if (t >= 8) {
    const e = E.snap(P(t, 8.0, 8.25));
    css($('eH1'), { transform: `scale(${lerp(1.6, 1, e)})`, opacity: e * (1 - E.in(P(t, 9.55, 9.8))) }); fit($('eH1'), 940);
    fadeUp($('eH2'), t, 8.15, .5, 16); $('eH2').style.opacity *= 1 - P(t, 9.55, 9.8);
  }
  // phone: rises out of the wall, settles, then the camera dives into the screen
  const rise = E.out(P(t, 6.15, 7.1));
  const dive = E.in(P(t, 9.55, 10.0));
  const s = lerp(.95, 4.2, dive);
  const [ax, ay] = aim(.5, .3, s, 540, 900);
  const x = lerp(540, ax, dive), y = lerp(lerp(2300, 1190, rise), ay, dive);
  css($('pwrap'), { transform: `translate(${x - PH.w / 2}px, ${y - PH.h / 2}px) scale(${s})` });
  const ry = lerp(lerp(-38, -12, rise) + Math.sin(t * 1.1) * 3, 0, dive), rx = lerp(lerp(28, 6, rise), 0, dive);
  $('phone3d').style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${lerp(lerp(10, 0, rise), 0, dive)}deg)`;
  $('glare').style.backgroundPosition = `${50 + ry * 2.2}% 0`;
  const scroll = keys(t, [[7.1, 0], [7.85, 700, 'inOut'], [8.8, 700], [9.5, 1250, 'inOut']]);
  $('homeTall').style.transform = `translateY(${-scroll * 520 / 412}px)`;
  $('topbar').style.transform = `translateY(${-E.out(P(scroll, 0, 140)) * 100}%)`;
  // the Top 10 numerals break out of the screen
  [['n1', .1, 8.0, -300, -40], ['n2', .45, 8.12, 0, 260], ['n3', .86, 8.24, 300, -20]].forEach(([id, u, ti, dx, dy]) => {
    const el = $(id); const on = t >= ti && t < ti + 1.4; show(el, on); if (!on) return;
    const p = E.out(P(t, ti, ti + .9));
    const [px, py] = [x - PH.w / 2 * s + (18 + u * 520) * s + (PH.w / 2) * (1 - 1) , y - PH.h / 2 * s + (18 + .33 * 1126) * s];
    const sx = 540 + (px - 540), sy = py;
    css(el, { left: `${lerp(sx, sx + dx * 1.2, p)}px`, top: `${lerp(sy, sy + dy, p)}px`, transform: `scale(${lerp(.28, 1.5, p)}) rotate(${lerp(0, dx / 40, p)}deg)`, opacity: clamp(P(t, ti, ti + .1)) * (1 - E.in(P(t, ti + .9, ti + 1.4))) });
  });
}

function renderSplash(u) {
  // the app's own timings (ms): bars 620 / 620 @110, fold wipe 640 @300, shine 720 @960, word 620 @820, tag 620 @980
  const bar = (d, l) => E.out(P(u, d, d + l));
  const L = bar(0, .62), R = bar(.11, .62), W = E.inOut(P(u, .30, .94)), Sh = E.shine(P(u, .96, 1.68));
  $('spL').setAttribute('transform', `scale(1 ${L || 1e-4})`);
  $('spR').setAttribute('transform', `translate(0 ${800 * (1 - R)}) scale(1 ${R || 1e-4})`);
  $('spWipe').setAttribute('transform', `translate(0 ${-40 + 40 * W}) scale(1 ${W || 1e-4})`);
  $('spS').setAttribute('transform', `translate(${lerp(-340, 1000, Sh)} 0) translate(0 -20) skewX(-18) translate(0 20)`);
  const rise = (el, d) => { const a = E.out(P(u, d, d + .62)); css(el, { opacity: a, transform: `translateY(${(1 - a) * 26}px)` }); };
  rise($('spWord'), .82); rise($('spTag'), .98);
  const b = $('spBrand'); b.style.top = `${(1920 - b.offsetHeight) / 2}px`;
  fadeUp($('spCta'), u, 1.75, .8, 14);
}

async function ready() {
  for (const f of ['900 100px Archivo', '500 100px JB', '800 100px Inter', 'italic 100px Serif']) await document.fonts.load(f);
  await document.fonts.ready;
  await Promise.all([...document.images, ...Object.values(ringImgs)].map(im => im.decode().catch(() => {})));
  return true;
}
window.CUTS = [2, 2.5, 3, 3.5, 4, 4.25, 4.5, 4.75, 5, 5.25, 5.5, 10, 12, 14, 14.4, 14.8, 15.2, 15.6, 16, 16.5, 17, 17.5];
window.render = render; window.ready = ready;
const q = new URLSearchParams(location.search);
if (q.has('t')) ready().then(() => render(+q.get('t')));
</script>
